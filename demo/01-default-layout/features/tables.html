  <!-- source : features/tables.md-->
  <article class="markdown-body">
    <h1 id="tables">Tables</h1><p>Note that you can generate markdown tables with <a href="https://www.tablesgenerator.com/markdown_tables" target="_blank">www.tablesgenerator.com</a></p>
<h2 id="basic-table">Basic table</h2><table>
<thead>
<tr>
<th>Syntax</th>
<th>Description</th>
</tr>
</thead>
<tbody><tr>
<td>Header</td>
<td>Title</td>
</tr>
<tr>
<td>Paragraph</td>
<td>Text</td>
</tr>
</tbody></table>
<h2 id="table-with-alignment">Table with alignment</h2><table>
<thead>
<tr>
<th align="left">Syntax</th>
<th align="center">Description</th>
<th align="right">Test Text</th>
</tr>
</thead>
<tbody><tr>
<td align="left">Header</td>
<td align="center">Title</td>
<td align="right">Here&#39;s this</td>
</tr>
<tr>
<td align="left">Paragraph</td>
<td align="center">Text</td>
<td align="right">And more</td>
</tr>
</tbody></table>
<p><a href="../">Back to home...</a></p>

  </article>

  <!-- hightlight.pack.js -->
  <script type="text/javascript"

    hljs.configure({ cssSelector: 'pre code:not(.language-mermaid)' });
    hljs.highlightAll();

  <!-- https://www.mathjax.org -->
  <script>
    MathJax = {
      loader: {
        load: ['input/tex', 'output/svg', 'ui/menu']
      },
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/startup.js"

    mermaid.initialize({
      startOnLoad: false,

        useMaxWidth: true
      }
    });
    mermaid.run({ querySelector: '.language-mermaid' });
  </script>
