<!doctype html>
<html lang="{{{ lang }}}">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimal-ui">
  <title>{{title}}</title>

  <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.9.0/github-markdown-light.min.css"
    integrity="sha512-P1HblB9m0U4VIhm9yWNrCuFLbHfDdR31lkAU+m4dvr8tffc5xtZdaFGT9yugmgjEU3gYSb6i3w/fjUU8XsLHww=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/styles/github.min.css"
    integrity="sha512-0aPQyyeZrWj9sCA46UlmWgKOP0mUipLQ6OZXu8l4IcAmD2u31EPEy9VcIMvl7SoAaKe8bLXZhYoMaE/in+gcgA=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    html, body {
      width: 95%;
      margin: auto;
      padding-bottom: 50px;
    }
  </style>
</head>

<body>
  <!-- source : {{ relativePath }}-->
  <article class="markdown-body">
    {{{content}}}
  </article>

  <!-- hightlight.pack.js -->
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/highlight.min.js"
    integrity="sha512-VSPLUv/n1Bmn+4zoxBNwpuFAO3//79I0Aax/qHDx24R47vylPcc9PrHDCqlePwHnh3joiM7/YTQhcXyQAAxvPQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>hljs.highlightAll();</script>
</body>

</html>
