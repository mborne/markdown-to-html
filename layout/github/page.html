<!doctype html>
<html lang="{{{ lang }}}">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimal-ui">
  <title>{{title}}</title>

  <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/2.10.0/github-markdown.min.css"
    integrity="sha512-gDWxWqajGE6EYw1L7qS7QDWNzB2CLEBalwmj94POCBSg2dfgaR6GdpE7VlX2h2iwq3RnDxiEKdfJpTCwOu6GCg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/9.13.1/styles/github.min.css"
    integrity="sha512-AyzPq0SSlhPTRNBHuENz8VQvO7XcNLsTYpUq+aldFyuVsbly+18bUXp/lFTAvQSiabSPYCKw6nSOL4BOLJaikw=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    html, body {
      width: 95%;
      margin: auto;
      padding-bottom: 50px;
    }
  </style>
</head>

<body>
  <!-- source : {{ relativePath }}-->
  <article class="markdown-body">
    {{{content}}}
  </article>

  <!-- hightlight.pack.js -->
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/9.13.1/highlight.min.js"
    integrity="sha512-XJ+kBRoBFQps17m1/oCbbESEJtXMrCKq6Ls2a9MKSwoQsSrUk8i+qOd/7YXfl3BsAlfjUyQ4EPd0b0JB24Bgwg=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>hljs.initHighlightingOnLoad();</script>
</body>

</html>
